# 放在受控 nginx http{} 的 server 配置目录中，先填入证书与构建目录。
# 仅回环 HTTPS 示例；非本机发布需要单独确定监听、证书、国密传输要求与安全策略。
server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost;
    ssl_certificate /etc/platform-base/tls/fullchain.pem;
    ssl_certificate_key /etc/platform-base/tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/platform-base/frontend;
    index index.html;
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # 来源身份不信任任意客户端 X-Forwarded-For；后端按明确代理配置处理。
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
